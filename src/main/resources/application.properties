spring.application.name=java-systemd
# filled in by Maven (resource filtering): project version and the pipeline id (-Dbuild.id=...)
app.version=@project.version@
app.build=@build.id@

# systemd sets these (EnvironmentFile); the defaults suit a laptop with a local PostgreSQL
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}

# The schema is migrated by the application itself when it starts (src/main/resources/db/migration)
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
