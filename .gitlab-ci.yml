# Spring Boot + PostgreSQL, deployed to a Linux server as a systemd unit.
#   test       unit tests, and the application started against a PostgreSQL job "service"
#   package    app.jar
#   staging    rsync to releases/<pipeline id>, switch the "current" symlink, restart the unit  (automatic)
#   production the same                                                                          (manual)
# Database migrations are NOT a pipeline step: Flyway runs when the application starts (src/main/resources/db/migration).

include:
  - project: examples/ci-templates
    ref: main
    file: /rocky.yml

stages: [test, package, staging, production]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  APP: java-systemd
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B -ntp"

# Rocky Linux with the packaged OpenJDK 21 and Maven 3.9
.maven:
  image: rockylinux/rockylinux:10
  before_script:
    - !reference [.rocky-dnf, before_script]
    - dnf -y -q install maven-openjdk21 java-21-openjdk-devel
    - mvn --version | head -3
  cache:
    key: maven-$APP
    paths: [.m2/repository]

test:
  extends: .maven
  stage: test
  # A PostgreSQL container that lives next to the job and is reachable as "postgres". The image comes through the
  # group's Dependency Proxy (a pull-through cache for Docker Hub).
  services:
    - name: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: app_test
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app_test
    SPRING_DATASOURCE_USERNAME: app
    SPRING_DATASOURCE_PASSWORD: app
  script:
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml

package:
  extends: .maven
  stage: package
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests -Dbuild.id=$CI_PIPELINE_ID package
  artifacts:
    paths: [target/app.jar]
    expire_in: 1 week

.deploy:
  image: rockylinux/rockylinux:10
  needs: [package]
  resource_group: $APP-$DEPLOY_ENV
  before_script:
    - !reference [.rocky-dnf, before_script]
    - dnf -y -q install openssh-clients rsync curl
    - !reference [.ssh-setup, before_script]
  script:
    - deploy/release.sh $DEPLOY_ENV

deploy:staging:
  extends: .deploy
  stage: staging
  variables:
    DEPLOY_ENV: staging
  environment:
    name: staging
    url: https://$APP-staging.$EXAMPLES_DOMAIN
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:production:
  extends: .deploy
  stage: production
  needs: [package, deploy:staging]
  variables:
    DEPLOY_ENV: production
  environment:
    name: production
    url: https://$APP-production.$EXAMPLES_DOMAIN
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# Go back to the release before the current one (the old directories are still on the server)
.rollback:
  image: rockylinux/rockylinux:10
  needs: []
  before_script:
    - !reference [.rocky-dnf, before_script]
    - dnf -y -q install openssh-clients curl
    - !reference [.ssh-setup, before_script]
  script:
    - deploy/rollback.sh $DEPLOY_ENV
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

rollback:staging:
  extends: .rollback
  stage: staging
  variables:
    DEPLOY_ENV: staging
  environment:
    name: staging
    action: access

rollback:production:
  extends: .rollback
  stage: production
  variables:
    DEPLOY_ENV: production
  environment:
    name: production
    action: access
